<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Arial', bold;
      background: #1a1510;
      color: #e8dfc8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      border-bottom: 1px solid #3a3020;
      background: #aec1c7;
      z-index: 1000;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #003566;
      white-space: nowrap;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tool-btn {
      width: 24px;
      height: 24px;
      background: #aec1c7;
      border: 1px solid #3a3020;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .tool-btn:hover { background: #3f6e7d; }

    .tool-btn.active {
      border-color: #f95738;
      background: #f77f00;
    }

    .tool-btn svg { width: 20px; height: 20px; }

    .divider {
      width: 1px;
      height: 24px;
      background: #3a3020;
      margin: 0 4px;
    }

    #color-picker {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .color-dot.active { border-color: #e8dfc8; }

    #hint {
      font-size: 0.72rem;
      color: #6b6050;
      margin-left: auto;
      white-space: nowrap;
    }

    #map { flex: 1; background: #1a1510; }
    .leaflet-container { background: #1a1510; }

    .leaflet-control-zoom a {
      background: #2a2018 !important;
      color: #c8b87a !important;
      border-color: #3a3020 !important;
    }
    .leaflet-control-zoom a:hover { background: #3a3020 !important; }

    .leaflet-control-attribution {
      background: rgba(26,21,16,0.8) !important;
      color: #6b6050 !important;
      font-size: 10px;
    }
    .leaflet-control-attribution a { color: #8a7850 !important; }

    .leaflet-container.placing { cursor: crosshair !important; }

    .marker-label {
      background: rgba(26,21,16,0.85);
      border: 1px solid #3a3020;
      color: #e8dfc8;
      font-family: 'Georgia', serif;
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .region-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #003566;
      font-family: 'Arial', sans-serif;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(255,255,255,0.6);
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>LSPD</h1>

    <div id="toolbar">
      <button class="tool-btn active" data-shape="pin" title="Pin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a5 5 0 0 1 5 5c0 4-5 10-5 10S7 11 7 7a5 5 0 0 1 5-5z"/><circle cx="12" cy="7" r="1.5" fill="currentColor"/></svg>
      </button>
      <button class="tool-btn" data-shape="star" title="Star">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 15,9 22,9 16.5,14 18.5,21 12,17 5.5,21 7.5,14 2,9 9,9"/></svg>
      </button>
      <button class="tool-btn" data-shape="circle" title="Circle">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
      </button>
      <button class="tool-btn" data-shape="square" title="Square">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
      <button class="tool-btn" data-shape="triangle" title="Triangle">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12,3 22,21 2,21"/></svg>
      </button>
      <button class="tool-btn" data-shape="cross" title="Cross">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="20" rx="1"/><rect x="2" y="9" width="20" height="6" rx="1"/></svg>
      </button>

      <div class="divider"></div>

      <!-- region tool -->
      <button class="tool-btn" id="region-btn" title="Draw a region (drag to highlight an area)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 2"/>
        </svg>
      </button>

      <div class="divider"></div>

      <div id="color-picker">
        <div class="color-dot active" data-color="#c0392b" style="background:#c0392b" title="Red"></div>
        <div class="color-dot" data-color="#c8b87a" style="background:#c8b87a" title="Gold"></div>
        <div class="color-dot" data-color="#4a90d9" style="background:#4a90d9" title="Blue"></div>
        <div class="color-dot" data-color="#5dbb6a" style="background:#5dbb6a" title="Green"></div>
        <div class="color-dot" data-color="#e8dfc8" style="background:#e8dfc8" title="White"></div>
      </div>

      <div class="divider"></div>

      <button class="tool-btn" id="delete-btn" title="Delete mode — click a marker or region to remove it">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6M14,11v6"/><path d="M9,6V4h6v2"/></svg>
      </button>
    </div>

    <span id="hint">Choose a shape · click the map to place · right-click marker to remove</span>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── CONFIGURATION ──────────────────────────────────────────────
    const IMAGE_FILE   = 'mapls.png';
    const IMAGE_WIDTH  = 4950;
    const IMAGE_HEIGHT = 5023;
    // ──────────────────────────────────────────────────────────────

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -3,
      maxZoom: 3,
      zoomSnap: 0.25,
    });

    const bounds = [[0, 0], [IMAGE_HEIGHT, IMAGE_WIDTH]];
    L.imageOverlay(IMAGE_FILE, bounds).addTo(map);
    map.fitBounds(bounds);
    map.setMaxBounds(bounds.map(([y, x]) => [y * 1.2, x * 1.2]));

    // ── STATE ──────────────────────────────────────────────────────
    let selectedShape = 'pin';
    let selectedColor = '#c0392b';
    let deleteMode = false;
    let regionMode = false;

    // ── HELPERS ───────────────────────────────────────────────────
    function setHint(text) { document.getElementById('hint').textContent = text; }

    function clearModes() {
      deleteMode = false;
      regionMode = false;
      document.getElementById('delete-btn').classList.remove('active');
      document.getElementById('region-btn').classList.remove('active');
      map.getContainer().classList.remove('placing');
      map.dragging.enable();
    }

    // ── TOOLBAR: MARKER SHAPES ────────────────────────────────────
    document.querySelectorAll('.tool-btn[data-shape]').forEach(btn => {
      btn.addEventListener('click', () => {
        clearModes();
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedShape = btn.dataset.shape;
        map.getContainer().classList.add('placing');
        setHint('Click the map to place a marker · right-click marker to remove');
      });
    });

    // ── TOOLBAR: COLORS ───────────────────────────────────────────
    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        selectedColor = dot.dataset.color;
      });
    });

    // ── TOOLBAR: REGION ───────────────────────────────────────────
    document.getElementById('region-btn').addEventListener('click', () => {
      const activate = !regionMode;
      clearModes();
      if (activate) {
        regionMode = true;
        document.getElementById('region-btn').classList.add('active');
        document.querySelectorAll('.tool-btn[data-shape]').forEach(b => b.classList.remove('active'));
        map.getContainer().classList.add('placing');
        setHint('Drag on the map to draw a highlighted region · right-click region to remove');
      } else {
        setHint('Choose a shape · click the map to place · right-click marker to remove');
      }
    });

    // ── TOOLBAR: DELETE ───────────────────────────────────────────
    document.getElementById('delete-btn').addEventListener('click', () => {
      const activate = !deleteMode;
      clearModes();
      if (activate) {
        deleteMode = true;
        document.getElementById('delete-btn').classList.add('active');
        document.querySelectorAll('.tool-btn[data-shape]').forEach(b => b.classList.remove('active'));
        map.getContainer().classList.add('placing');
        setHint('Click a marker or region to remove it');
      } else {
        setHint('Choose a shape · click the map to place · right-click marker to remove');
      }
    });

    // ── SVG ICON BUILDER ──────────────────────────────────────────
    function makeSVG(shape, color) {
      const stroke = 'rgba(0,0,0,0.55)';
      let inner = '';
      if (shape === 'pin')      inner = `<path d="M16 3a7 7 0 0 1 7 7c0 6-7 14-7 14S9 16 9 10a7 7 0 0 1 7-7z" fill="${color}" stroke="${stroke}" stroke-width="2"/><circle cx="16" cy="10" r="2.5" fill="white" opacity="0.6"/>`;
      if (shape === 'star')     inner = `<polygon points="16,3 19.5,12 29,12 22,18 24.5,27 16,22 7.5,27 10,18 3,12 12.5,12" fill="${color}" stroke="${stroke}" stroke-width="1.5"/>`;
      if (shape === 'circle')   inner = `<circle cx="16" cy="16" r="11" fill="${color}" stroke="${stroke}" stroke-width="2"/>`;
      if (shape === 'square')   inner = `<rect x="5" y="5" width="22" height="22" rx="3" fill="${color}" stroke="${stroke}" stroke-width="2"/>`;
      if (shape === 'triangle') inner = `<polygon points="16,3 29,28 3,28" fill="${color}" stroke="${stroke}" stroke-width="1.5"/>`;
      if (shape === 'cross')    inner = `<rect x="12" y="3" width="8" height="26" rx="2" fill="${color}" stroke="${stroke}" stroke-width="1.5"/><rect x="3" y="12" width="26" height="8" rx="2" fill="${color}" stroke="${stroke}" stroke-width="1.5"/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">${inner}</svg>`;
    }

    function makeIcon(shape, color) {
      return L.divIcon({
        html: makeSVG(shape, color),
        className: '',
        iconSize: [32, 32],
        iconAnchor: [16, shape === 'pin' ? 30 : 16],
      });
    }

    // ── PLACE MARKERS ────────────────────────────────────────────
    map.getContainer().classList.add('placing');

    map.on('click', e => {
      if (deleteMode || regionMode) return;
      const label = prompt('Label for this marker (leave blank for none):');
      if (label === null) return;
      const marker = L.marker(e.latlng, { icon: makeIcon(selectedShape, selectedColor) }).addTo(map);
      if (label.trim()) {
        marker.bindTooltip(label.trim(), {
          permanent: true,
          direction: 'right',
          className: 'marker-label',
          offset: [10, 0]
        }).openTooltip();
      }
      marker.on('contextmenu', () => map.removeLayer(marker));
      marker.on('click', () => { if (deleteMode) map.removeLayer(marker); });
    });

    // ── REGION DRAWING ───────────────────────────────────────────
    let dragStart = null;
    let previewRect = null;

    map.on('mousedown', e => {
      if (!regionMode) return;
      dragStart = e.latlng;
      map.dragging.disable();

      const onMove = ev => {
        if (!dragStart) return;
        const cur = map.mouseEventToLatLng(ev.originalEvent);
        const b = L.latLngBounds(dragStart, cur);
        if (previewRect) map.removeLayer(previewRect);
        previewRect = L.rectangle(b, {
          color: selectedColor,
          weight: 2,
          opacity: 0.9,
          fillColor: selectedColor,
          fillOpacity: 0.15,
          dashArray: '6 4',
          interactive: false,
        }).addTo(map);
      };

      const onUp = ev => {
        map.off('mousemove', onMove);
        map.off('mouseup', onUp);
        map.dragging.enable();

        if (!dragStart) return;
        const end = map.mouseEventToLatLng(ev.originalEvent);
        const b = L.latLngBounds(dragStart, end);
        dragStart = null;

        if (previewRect) { map.removeLayer(previewRect); previewRect = null; }

        const size = map.latLngToContainerPoint(b.getNorthEast()).distanceTo(
                     map.latLngToContainerPoint(b.getSouthWest()));
        if (size < 10) return;

        const label = prompt('Label for this region (leave blank for none):');
        if (label === null) return;

        const rect = L.rectangle(b, {
          color: selectedColor,
          weight: 2,
          opacity: 0.85,
          fillColor: selectedColor,
          fillOpacity: 0.12,
        }).addTo(map);

        let labelMarker = null;
        if (label.trim()) {
          labelMarker = L.marker(b.getCenter(), {
            icon: L.divIcon({ className: '', html: '', iconSize: [0, 0] })
          }).addTo(map);
          labelMarker.bindTooltip(label.trim(), {
            permanent: true,
            direction: 'center',
            className: 'region-label',
          }).openTooltip();
        }

        const removeRegion = () => {
          map.removeLayer(rect);
          if (labelMarker) map.removeLayer(labelMarker);
        };

        rect.on('contextmenu', removeRegion);
        rect.on('click', () => { if (deleteMode) removeRegion(); });
        if (labelMarker) {
          labelMarker.on('contextmenu', removeRegion);
          labelMarker.on('click', () => { if (deleteMode) removeRegion(); });
        }
      };

      map.on('mousemove', onMove);
      map.on('mouseup', onUp);
    });
  </script>

</body>
</html>
